<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Rounded squircle badge background for high contrast -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="#181825" stroke="#313244" stroke-width="2"/>

  <!-- Centered battery content group -->
  <g transform="translate(1.5, 0)">
    <!-- Horizontal Battery outline: y=22 to 42, center at y=32 -->
    <rect x="12" y="22" width="34" height="20" rx="4" ry="4" fill="none" stroke="#89b4fa" stroke-width="2.5"/>
    <!-- Battery terminal tip -->
    <path d="M48 28 C49.5 28, 50 29, 50 30 L50 34 C50 35, 49.5 36, 48 36" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 70% charge fill -->
    <rect x="15" y="25" width="20" height="14" rx="2" ry="2" fill="#89b4fa" opacity="0.45"/>

    <!-- Security Shield: centered vertically at y=32, tip cleanly covers bottom battery border (y=44) -->
    <path d="M29 20 L38 23 C38 33, 33 40, 29 44 C25 40, 20 33, 20 23 Z" fill="#94e2d5" stroke="#181825" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Checkmark inside shield: centered with shield -->
    <path d="M25 31.5 L28.5 35 L33.5 27.5" fill="none" stroke="#181825" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
