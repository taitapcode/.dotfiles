<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Rounded squircle badge background for high contrast -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="#181825" stroke="#313244" stroke-width="2"/>

  <!-- Centered battery content group with original proportional shapes -->
  <g transform="translate(1.5, 0)">
    <!-- Horizontal Battery outline -->
    <rect x="12" y="22" width="34" height="20" rx="4" ry="4" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>
    <!-- Battery terminal tip -->
    <path d="M48 28 C49.5 28, 50 29, 50 30 L50 34 C50 35, 49.5 36, 48 36" fill="none" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 100% full charge fill -->
    <rect x="15" y="25" width="28" height="14" rx="2" ry="2" fill="#a6e3a1" opacity="0.4"/>

    <!-- Original wide lightning bolt with crisp stroke -->
    <path d="M30 15 L22 33 L29 33 L26 49 L38 29 L31 29 Z" fill="#f9e2af" stroke="#181825" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
